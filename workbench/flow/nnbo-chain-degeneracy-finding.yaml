fields:
  statement: 'Among S^z product states, every arrangement of zigzag chains in which down chains are isolated (M = 1/5, 1/3, 1/2, 3/5, 2/3, …) lies exactly on the zigzag–polarized line at $h_s=J_1+3J_3$, for any J1, J3, D; other states lie above. Zigzag chains couple only to neighbouring chains, so this is the saturation-field exclusion degeneracy of a 1D Ising chain.'
  condition: Product states in all supercells up to 6 cells; quantum fluctuations and small terms (Kitaev, J2, interlayer) lift it.
