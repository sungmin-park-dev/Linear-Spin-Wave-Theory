fields:
  goal: 'Answer the review question on D34: what the axis-rotation condition means and what happens when a term breaks it.'
  setup: Phase of circular components $e^{-i(s_p+s_q)\phi_i}$ for one-site and Zeeman terms; in-plane field and in-plane easy axis on a Bravais planar spiral.
  result: Breaking terms carry first or second harmonics, the rotating-frame torque varies from cell to cell, and the stationary state is a distorted spiral (components at $2Q$ for an in-plane field, $3Q$ for an in-plane easy axis); LSWT then needs a magnetic cell or an approximant. The condition is the stated requirement of the method, not a toolkit choice.
