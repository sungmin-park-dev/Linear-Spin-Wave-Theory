fields:
  statement: Following the standard definition (Chern numbers for separated bands only), the Chern number of a Goldstone band is the limit after a small symmetry-breaking gap; the loop phase is the check that the limit is well defined. Both models give $(+1,-1)$ in the gapped limit, equal to the integral avoiding $\Gamma$.
  condition: Ferromagnet gapped by $h=0.05,0.01$; canted antiferromagnet by $-KS^xS^x$, $K=0.05,0.005$ ($\Gamma$ gap $\propto\sqrt K$). At $S=1/2$ a single-ion anisotropy is a constant and cannot open the gap.
