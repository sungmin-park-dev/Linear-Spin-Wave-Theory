fields:
  goal: How should a single-ion term $\mathbf S_i^TA\mathbf S_i$ enter the classical energy and LSWT?
  setup: Spin coherent-state expectation; comparison with exact single-spin spectra up to $S=20$ and torus ED.
  result: Use $S(S-\tfrac12)\mathbf n^TA\mathbf n+\tfrac S2\operatorname{tr}A$, i.e. the coefficient $(1-\tfrac1{2S})A$, without a transverse normal-ordering constant; the easy-axis gap $(2S-1)|D|$ is exact and one-magnon bands match ED to $10^{-11}$.
