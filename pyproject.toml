[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spin-toolkit"
dynamic = ["version"]
description = "Semiclassical toolkit for 2D spin models: classical order, linear and nonlinear spin-wave theory"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "Sung-Min Park", email = "sungmin.park.0226@gmail.com"},
]
keywords = ["condensed matter", "magnetism", "spin waves", "magnons", "LSWT", "semiclassical"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
progress = [
    "tqdm>=4.60",
]
dev = [
    "tqdm>=4.60",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/sungmin-park-dev/Linear-Spin-Wave-Theory"
Repository = "https://github.com/sungmin-park-dev/Linear-Spin-Wave-Theory"

[tool.setuptools.dynamic]
version = {attr = "spintoolkit.__version__"}

[tool.setuptools.packages.find]
where = ["code-space"]
include = ["spintoolkit*", "lswt"]
exclude = ["modules*", "tests*", "examples*", "docs*"]
