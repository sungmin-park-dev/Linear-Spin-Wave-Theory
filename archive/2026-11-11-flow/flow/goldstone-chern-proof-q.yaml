fields:
  question: Does the loop Berry phase around a Goldstone point vanish in general, so that the gapped-limit Chern number equals the integral avoiding $k_0$, also for $B\neq0$?
  motivation: Shown only for two honeycomb models; the $B\neq0$ Kubo numerators are not settled by a general argument.
  result: For a linear Goldstone mode (one-dimensional kernel, linear dispersion in every direction) the loop Berry phase vanishes like r, the integral avoiding k0 equals the gapped limit and is an integer. For a quadratic zero mode whose pairing with the hole partner is of the same order as the normal part the loop phase tends to a constant and the integral is not an integer (square-lattice counterexample, loop phase -0.1494).
