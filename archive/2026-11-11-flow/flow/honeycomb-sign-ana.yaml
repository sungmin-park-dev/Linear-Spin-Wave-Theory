fields:
  goal: Derive the sign of the Chern numbers, which the worked example had fixed only numerically.
  setup: 'Dirac expansion at $\pm K$: $f_{\pm K+q}=\mp(\sqrt3/2)(q_x\pm iq_y)$, Jacobian $\eta=\mp(3/4)J^2S^2$, mass $d^z=\mp3\sqrt3DS$.'
  result: Each corner adds $\tfrac12\operatorname{sgn}(\eta d^z)=\tfrac12\operatorname{sgn}D$, so $C_-=\operatorname{sgn}D$, $C_+=-\operatorname{sgn}D$ for all $D\neq0$; agrees with Kubo and link variables, Dirac coefficients checked by finite differences in the test.
