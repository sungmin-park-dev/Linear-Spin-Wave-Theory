# Build spin-toolkit and check the sdist and wheel. Nothing is uploaded to a
# package index: the package is installed from GitHub (README "Installation";
# 2026-10-16 user decision, workbench/tasks/2026-10-15-release-0-2-0.md).
# Runs by hand from the Actions tab and on version tags (v*); the built files
# are kept as the "dist" artifact of the run.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "import spintoolkit as stk; print(stk.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
