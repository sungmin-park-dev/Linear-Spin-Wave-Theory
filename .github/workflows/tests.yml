name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }}${{ matrix.minimum && ', minimum deps' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python >= 3.9) and a recent release.
        python-version: ["3.9", "3.12"]
        minimum: [false]
        include:
          # The lower bounds declared in pyproject.toml (numpy 1.x).
          - python-version: "3.9"
            minimum: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Pin the minimum dependency versions
        if: matrix.minimum
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.21.6" "scipy==1.7.3" "matplotlib==3.4.3" "tqdm==4.60.0"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest code-space/tests -q
